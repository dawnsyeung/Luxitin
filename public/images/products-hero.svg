<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Luxitin product lineup illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ddc8"/>
      <stop offset="0.5" stop-color="#bda46a"/>
      <stop offset="1" stop-color="#c8cdd6"/>
    </linearGradient>
    <radialGradient id="halo" cx="40%" cy="20%" r="70%">
      <stop offset="0" stop-color="#bda46a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bda46a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="34" fill="url(#halo)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial" fill="#0f0f10">
    <text x="80" y="120" font-size="30" font-weight="800">Our lineup</text>
    <text x="80" y="160" font-size="16" opacity="0.62">Six products. One breakthrough ingredient. Compostable packaging.</text>
  </g>

  <!-- Shelf -->
  <rect x="120" y="780" width="1360" height="40" rx="20" fill="#0b0b0d" opacity="0.06"/>

  <!-- Product silhouettes (simple, consistent) -->
  <g stroke="url(#metal)" stroke-width="6" fill="#ffffff" fill-opacity="0.78">
    <!-- Shampoo -->
    <g transform="translate(210 300)">
      <rect x="40" y="40" width="150" height="420" rx="70"/>
      <rect x="70" y="0" width="90" height="60" rx="24" fill-opacity="0.55"/>
      <rect x="65" y="190" width="100" height="120" rx="24" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
    <!-- Mask jar -->
    <g transform="translate(420 430)">
      <rect x="30" y="0" width="220" height="70" rx="34" fill-opacity="0.55"/>
      <rect x="0" y="55" width="280" height="210" rx="60"/>
      <rect x="30" y="115" width="220" height="110" rx="30" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
    <!-- Serum -->
    <g transform="translate(710 340)">
      <rect x="40" y="70" width="140" height="360" rx="60"/>
      <rect x="82" y="0" width="56" height="90" rx="22" fill-opacity="0.55"/>
      <rect x="62" y="220" width="96" height="90" rx="22" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
    <!-- Spray -->
    <g transform="translate(910 300)">
      <rect x="40" y="80" width="150" height="380" rx="70"/>
      <rect x="80" y="0" width="70" height="90" rx="18" fill-opacity="0.55"/>
      <rect x="85" y="30" width="60" height="30" rx="12" fill-opacity="0.40"/>
      <rect x="65" y="220" width="100" height="100" rx="24" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
    <!-- Elixir -->
    <g transform="translate(1120 330)">
      <rect x="46" y="90" width="138" height="350" rx="60"/>
      <rect x="80" y="0" width="70" height="110" rx="26" fill-opacity="0.55"/>
      <circle cx="115" cy="60" r="18" fill="#0b0b0d" fill-opacity="0.05" stroke="#0b0b0d" stroke-opacity="0.06"/>
      <rect x="68" y="240" width="94" height="96" rx="22" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
    <!-- Overnight -->
    <g transform="translate(1320 350)">
      <rect x="40" y="120" width="150" height="320" rx="70"/>
      <rect x="65" y="40" width="100" height="90" rx="26" fill-opacity="0.55"/>
      <rect x="62" y="250" width="106" height="90" rx="22" fill="#0b0b0d" fill-opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    </g>
  </g>

  <!-- Callout -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial">
    <rect x="120" y="210" width="640" height="120" rx="26" fill="#0b0b0d" opacity="0.05" stroke="url(#metal)" stroke-opacity="0.25"/>
    <text x="160" y="258" font-size="16" font-weight="800" fill="#0f0f10" opacity="0.82">Chitin-based packaging</text>
    <text x="160" y="288" font-size="13" fill="#0f0f10" opacity="0.62">Designed for product protection, then composts back to nature.</text>
  </g>
</svg>

