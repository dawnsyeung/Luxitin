<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Luxitin Scalp Soothing Elixir illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ddc8"/>
      <stop offset="0.5" stop-color="#bda46a"/>
      <stop offset="1" stop-color="#c8cdd6"/>
    </linearGradient>
    <radialGradient id="mint" cx="20%" cy="30%" r="70%">
      <stop offset="0" stop-color="#49b37a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#49b37a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="28" fill="url(#mint)"/>

  <!-- Dropper bottle -->
  <g transform="translate(490 90)">
    <rect x="100" y="-30" width="80" height="80" rx="28" fill="#bda46a" opacity="0.18" stroke="#0f0f10" stroke-opacity="0.08"/>
    <rect x="118" y="-70" width="44" height="50" rx="18" fill="#c8cdd6" opacity="0.20" stroke="#0f0f10" stroke-opacity="0.08"/>
    <rect x="50" y="40" width="180" height="520" rx="80" fill="#ffffff" opacity="0.78" stroke="url(#metal)" stroke-width="6"/>
    <rect x="72" y="260" width="136" height="170" rx="34" fill="#0b0b0d" opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
    <path d="M140,35 L140,110" stroke="#0f0f10" stroke-opacity="0.10" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="120" r="10" fill="#49b37a" opacity="0.35"/>
  </g>

  <!-- Calm icon -->
  <g transform="translate(86 206)">
    <circle cx="70" cy="70" r="70" fill="#0b0b0d" opacity="0.04" stroke="url(#metal)" stroke-width="4"/>
    <path d="M30,80 C55,60 85,60 110,80" fill="none" stroke="#49b37a" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <path d="M42,100 C60,88 80,88 98,100" fill="none" stroke="#49b37a" stroke-opacity="0.38" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial" fill="#0f0f10">
    <text x="70" y="110" font-size="18" font-weight="800" opacity="0.86">Luxitin Scalp Soothing Elixir</text>
    <text x="70" y="142" font-size="13" opacity="0.62">7% Luxitin · Naturally antibacterial chitin packaging</text>
  </g>
</svg>

