<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Luxitin Overnight Repair Treatment illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ddc8"/>
      <stop offset="0.5" stop-color="#bda46a"/>
      <stop offset="1" stop-color="#c8cdd6"/>
    </linearGradient>
    <radialGradient id="night" cx="80%" cy="25%" r="70%">
      <stop offset="0" stop-color="#c8cdd6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8cdd6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="28" fill="url(#night)"/>

  <!-- Overnight tube -->
  <g transform="translate(470 105)">
    <rect x="70" y="0" width="180" height="110" rx="46" fill="#c8cdd6" opacity="0.18" stroke="#0f0f10" stroke-opacity="0.08"/>
    <rect x="40" y="80" width="240" height="470" rx="110" fill="#ffffff" opacity="0.78" stroke="url(#metal)" stroke-width="6"/>
    <rect x="70" y="265" width="180" height="160" rx="34" fill="#0b0b0d" opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
  </g>

  <!-- Moon icon -->
  <g transform="translate(86 206)">
    <circle cx="70" cy="70" r="70" fill="#0b0b0d" opacity="0.04" stroke="url(#metal)" stroke-width="4"/>
    <path d="M92,42 C74,44 60,62 62,82 C64,104 84,118 104,112 C88,126 62,124 44,108 C26,92 22,66 36,46 C50,26 76,18 92,42 Z"
          fill="#bda46a" opacity="0.28"/>
    <circle cx="110" cy="58" r="6" fill="#49b37a" opacity="0.22"/>
  </g>

  <!-- Text -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial" fill="#0f0f10">
    <text x="70" y="110" font-size="18" font-weight="800" opacity="0.86">Luxitin Overnight Repair Treatment</text>
    <text x="70" y="142" font-size="13" opacity="0.62">12% Luxitin · Sustainable chitin container</text>
  </g>
</svg>

