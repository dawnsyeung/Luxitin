<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Luxitin Volumizing Spray illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ddc8"/>
      <stop offset="0.5" stop-color="#bda46a"/>
      <stop offset="1" stop-color="#c8cdd6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>

  <!-- Spray bottle -->
  <g transform="translate(460 95)">
    <rect x="95" y="-10" width="110" height="110" rx="30" fill="#c8cdd6" opacity="0.18" stroke="#0f0f10" stroke-opacity="0.08"/>
    <rect x="125" y="-45" width="50" height="50" rx="16" fill="#bda46a" opacity="0.18" stroke="#0f0f10" stroke-opacity="0.08"/>
    <rect x="80" y="-18" width="80" height="26" rx="13" fill="#0b0b0d" opacity="0.05"/>
    <rect x="35" y="70" width="230" height="480" rx="100" fill="#ffffff" opacity="0.78" stroke="url(#metal)" stroke-width="6"/>
    <rect x="65" y="255" width="170" height="150" rx="34" fill="#0b0b0d" opacity="0.04" stroke="#0b0b0d" stroke-opacity="0.06"/>
  </g>

  <!-- Mist dots -->
  <g fill="#49b37a" opacity="0.30">
    <circle cx="430" cy="140" r="6"/>
    <circle cx="400" cy="165" r="4"/>
    <circle cx="360" cy="190" r="5"/>
    <circle cx="420" cy="205" r="4"/>
    <circle cx="380" cy="230" r="6"/>
  </g>

  <!-- Text -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial" fill="#0f0f10">
    <text x="70" y="110" font-size="18" font-weight="800" opacity="0.86">Luxitin Volumizing Spray</text>
    <text x="70" y="142" font-size="13" opacity="0.62">6% Luxitin · Chitin-derived bottle</text>
  </g>
</svg>

